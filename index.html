const odemkni = async function (b64, heslo, kol) {
  const raw = Uint8Array.from(atob(b64), x => x.charCodeAt(0));
  const k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(heslo.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: raw.slice(0, 16), iterations: kol }, k0, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, k, raw.slice(28)));
};

async function zkus(heslo, pamatuj){

  document.open(); document.write(t); document.close();
}
